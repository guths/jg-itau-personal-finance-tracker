# MySQL local do finance tracker (exposto em 127.0.0.1:3307 porque a 3306 costuma estar ocupada)
# e o app completo (API + site) no profile "app":
#   docker compose --profile app up -d --build   → http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufinance", "-pfinance"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # sobrescreve o .env: dentro do Docker o MySQL é o serviço "mysql"
      MYSQL_DSN: finance:finance@tcp(mysql:3306)/finance?parseTime=true&loc=UTC
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      WEB_DIR: /app/web
      IN_CONTAINER: "true"
    ports:
      - "127.0.0.1:8080:8080" # só este computador acessa (o app não tem login)
    volumes:
      - app-data:/data # PDFs importados

volumes:
  mysql-data:
  app-data:
